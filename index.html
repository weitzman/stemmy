<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Split Open</title>
<meta name="description" content="A stem mixer for live recordings. Mute, solo, and fade the guitar, bass, keys, drums, and vocals.">
<link rel="canonical" href="https://weitzman.github.io/splitopen/">
<meta name="theme-color" content="#0b1026">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Split Open">
<meta property="og:title" content="Split Open">
<meta property="og:description" content="A stem mixer for live recordings. Mute, solo, and fade the guitar, bass, keys, drums, and vocals.">
<meta property="og:url" content="https://weitzman.github.io/splitopen/">
<meta property="og:image" content="https://weitzman.github.io/splitopen/social.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Split Open: a five-channel stem mixer with Trey, Mike, Page, Fish, and Vocals strips">
<meta property="og:locale" content="en_US">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Split Open">
<meta name="twitter:description" content="A stem mixer for live recordings. Mute, solo, and fade the guitar, bass, keys, drums, and vocals.">
<meta name="twitter:image" content="https://weitzman.github.io/splitopen/social.png">
<meta name="twitter:image:alt" content="Split Open: a five-channel stem mixer with Trey, Mike, Page, Fish, and Vocals strips">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>

<main class="app">
  <a class="logo" href="./" aria-label="Split Open">
    <svg class="logo-mark" viewBox="0 0 64 40" aria-hidden="true">
      <path d="M2 20h6l4-14 6 28 5-20 4 12 3-6h6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M36 20c10 0 10-16 24-16" fill="none" stroke="var(--trey)" stroke-width="3" stroke-linecap="round"/>
      <path d="M36 20c10 0 10-8 24-8" fill="none" stroke="var(--mike)" stroke-width="3" stroke-linecap="round"/>
      <path d="M36 20h24" fill="none" stroke="var(--page)" stroke-width="3" stroke-linecap="round"/>
      <path d="M36 20c10 0 10 8 24 8" fill="none" stroke="var(--fish)" stroke-width="3" stroke-linecap="round"/>
      <path d="M36 20c10 0 10 16 24 16" fill="none" stroke="var(--vox)" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <span class="logo-text">Split Open</span>
  </a>
  <header class="show">
    <h1>
      <button class="song-pick" id="song-pick" title="Choose a song (/)" aria-haspopup="dialog">
        <span id="title">Split Open</span>
        <span class="pick-pill" id="pick-pill" hidden><span id="pick-count"></span>
          <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </span>
      </button>
    </h1>
    <div class="venue" id="venue"></div>
    <nav class="guides" id="guides" aria-label="Guides"></nav>
  </header>

  <section class="loading" id="loading">
    <div class="loading-label" id="loading-label">Loading stems…</div>
    <div class="loading-bar"><div class="loading-fill" id="loading-fill"></div></div>
  </section>

  <section class="mixer" id="mixer" hidden></section>

  <section class="guide" id="guide" hidden>
    <div class="guide-head">
      <span class="guide-kicker" id="guide-kicker">Guide</span>
      <span class="guide-title" id="guide-title"></span>
      <button class="btn guide-add" id="guide-add" title="Start a tip here, with the current mix (N)" hidden>Tip: Start</button>
      <button class="btn guide-edit" id="guide-edit" title="Copy this guide into one of your own and change it">Copy &amp; edit</button>
      <button class="btn guide-close" id="guide-close" aria-label="Close guide">&times;</button>
    </div>
    <p class="guide-status" id="guide-status" hidden></p>
    <button class="btn continue" id="guide-continue" hidden>Continue</button>
    <ol class="guide-tips" id="guide-tips"></ol>
  </section>

  <section class="transport" id="transport" hidden>
    <button class="play" id="play" aria-label="Play">
      <svg class="icon-play" viewBox="0 0 24 24"><path d="M7 4l14 8-14 8z"/></svg>
      <svg class="icon-pause" viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
    </button>
    <div class="time" id="time-cur">0:00</div>
    <div class="seek-wrap">
      <div class="marks" id="marks" aria-hidden="true"></div>
      <input class="seek" id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
    </div>
    <div class="time" id="time-dur">0:00</div>
    <button class="btn share" id="share" title="Share a link to this mix and moment (L)" aria-label="Share mix">
      <svg class="icon-share" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 10H6.5A1.5 1.5 0 0 0 5 11.5v8A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5v-8a1.5 1.5 0 0 0-1.5-1.5H16"/><path d="M12 15V3M8 7l4-4 4 4"/></svg>
      <svg class="icon-check" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.78 4.22a.75.75 0 0 1 0 1.06l-7.25 7.25a.75.75 0 0 1-1.06 0L2.22 9.28a.751.751 0 0 1 .018-1.042.751.751 0 0 1 1.042-.018L6 10.94l6.72-6.72a.75.75 0 0 1 1.06 0Z"/></svg>
    </button>
  </section>

  <footer class="help">
    <span><kbd>space</kbd> play / pause</span>
    <span><kbd>1</kbd>–<kbd>5</kbd> solo</span>
    <span><kbd>←</kbd> <kbd>→</kbd> ±5 s</span>
    <span><kbd>/</kbd> choose a song</span>
    <span><kbd>L</kbd> share mix</span>
    <span><kbd>N</kbd> add a tip</span>
    <p class="colophon">Split Open so we can learn and appreciate. By <a href="https://weitzman.github.io">Moshe Weitzman</a>.</p>
  </footer>
</main>

<dialog class="sheet song-sheet" id="song-sheet" aria-labelledby="song-sheet-title" tabindex="-1">
  <div class="sheet-head">
    <h2 class="sheet-title" id="song-sheet-title">Songs</h2>
    <input class="sheet-search" id="song-search" type="search" placeholder="Search songs, bands, venues" aria-label="Search songs" autocomplete="off">
  </div>
  <div class="song-list" id="song-list"></div>
</dialog>

<dialog class="sheet mix-sheet" id="mix-sheet" aria-labelledby="mix-sheet-title">
  <h2 class="sheet-title" id="mix-sheet-title">Mix for this tip</h2>
  <div class="sheet-rows" id="mix-sheet-rows"></div>
  <div class="sheet-actions">
    <button class="more" id="mix-sheet-full" type="button">Full mix</button>
    <span class="spacer"></span>
    <button class="btn" id="mix-sheet-cancel" type="button">Cancel</button>
    <button class="btn use" id="mix-sheet-use" type="button">Use this mix</button>
  </div>
</dialog>

<script src="app.js"></script>
</body>
</html>
